stages:
  - test

# A Linux runner with Docker/Kubernetes executor is required. No Coinbase keys,
# private services or external market-data connection are needed by these tests.
linux-tests:
  image: debian:trixie-slim
  stage: test
  parallel:
    matrix:
      - CXX: [g++, clang++]
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends g++ clang cmake ninja-build git ca-certificates libssl-dev python3
  script:
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER="$CXX"
    - cmake --build build --parallel 2
    - ctest --test-dir build --output-on-failure --output-junit "$CI_PROJECT_DIR/build/linux-tests.xml" --output-log "$CI_PROJECT_DIR/build/linux-tests.log"
    - python3 tools/verify_csv.py --config data/fixture_config.json --require-expiration
    - ./build/bin/coinbase_ticker_statistics_app --help
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: build/linux-tests.xml
    paths:
      - build/linux-tests.log
      - build/Testing/Temporary/LastTest.log

